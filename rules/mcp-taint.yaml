        metavariable: $M
        regex: ^(readFile|readFileSync|writeFile|writeFileSync|appendFile|appendFileSync|createReadStream|createWriteStream|unlink|unlinkSync|rm|rmSync|rmdir|readdir|readdirSync|mkdir|mkdirSync|copyFile|copyFileSync|rename|renameSync|open|openSync|stat|statSync|outputFile|remove|move|copy)$
