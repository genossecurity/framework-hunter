- id: mcp-js-argument-injection
  mode: taint
  languages: *id001
  severity: WARNING
  message: 'MCP tool argument flows into the argv of a spawned program (no shell). If the program is attacker-chosen
    this is RCE; otherwise check for option injection (e.g. git --upload-pack=, ssh -oProxyCommand=, curl -o, tar
    --checkpoint-action). Fix: allowlist the binary, insert ''--'' before user args, reject leading ''-''.'
  metadata:
    cwe: CWE-88
    impact: RCE/file-write (tool-dependent)
    category: security
    confidence: MEDIUM
    tier: taint
    source: MCP tool handler parameter
    references:
    - https://modelcontextprotocol.io/specification
  pattern-sources: *id002
  pattern-sinks:
  - patterns:
    - pattern-either:
      - pattern: execFile($C, ...)
      - pattern: execFileSync($C, ...)
      - pattern: spawn($C, ...)
      - pattern: spawnSync($C, ...)
      - pattern: $CP.execFile($C, ...)
      - pattern: $CP.execFileSync($C, ...)
      - pattern: $CP.spawn($C, ...)
      - pattern: $CP.spawnSync($C, ...)
      - pattern: execa($C, ...)
      - pattern: execaSync($C, ...)
    - &id003
      pattern-not: '$FN(..., {..., shell: true, ...})'
    - &id004
      pattern-not: '$O.$FN(..., {..., shell: true, ...})'
    - focus-metavariable: $C
  - patterns:
    - pattern-either:
      - pattern: execFile($B, $C, ...)
      - pattern: execFileSync($B, $C, ...)
      - pattern: spawn($B, $C, ...)
      - pattern: spawnSync($B, $C, ...)
      - pattern: $CP.execFile($B, $C, ...)
      - pattern: $CP.spawn($B, $C, ...)
      - pattern: $CP.spawnSync($B, $C, ...)
      - pattern: execa($B, $C, ...)
      - pattern: execaSync($B, $C, ...)
    - *id003
    - *id004
    - focus-metavariable: $C
- id: mcp-js-path-traversal
  mode: taint
  languages: *id001
  severity: WARNING
  message: "MCP tool argument is used as a filesystem path. Without resolving it and checking it stays under an\
    \ allowed base directory, '../' or an absolute path reads/writes arbitrary files. Note: a path.resolve()+startsWith()\
    \ containment check is NOT modeled here \u2014 verify by hand before reporting."
